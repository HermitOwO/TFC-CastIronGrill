side = "BOTH"

[[dependencies.castirongrill]]
modId = "neoforge"
type = "required"
versionRange = "${neoForgeVersionRange}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.castirongrill]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftVersionRange}"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${modId}.mixins.json"
