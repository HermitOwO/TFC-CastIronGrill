# Loader metadata
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/HermitOwO/TFC-CastIronGrill/issues"

# Mod
[[mods]]
modId = "castirongrill"
version = "${modVersion}"
displayName = "TFC Cast Iron Grill"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/tfc-cast-iron-grill"
authors = "HermitOwO"
description = '''Cast iron grill addon for TFC.'''

# Dependencies
[[dependencies.castirongrill]]
modId = "tfc"
type = "required"
versionRange = "${tfcVersionRange}"
